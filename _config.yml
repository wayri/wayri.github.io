title: Yawar | Engineering the Physical Layer
description: Electrical engineering, power electronics, embedded systems, and engineering tools
author: Yawar Badri
baseurl: ""
url: "https://wayri.github.io"
timezone: Asia/Kolkata

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /blog/:year/:month/:day/:title/


<header class="portfolio-header">
    <div class="portfolio-header-row">
        <a class="portfolio-brand" href="{{ '/index.html' | relative_url }}" aria-label="Yawar / Wayri — Home"><span class="name-flip" aria-hidden="true"><span class="name-flip-front">YAWAR</span><span class="name-flip-back">WAYRI</span></span></a>
        <button type="button" id="site-theme-toggle" aria-label="Switch theme" title="Switch theme" aria-pressed="false"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
        <button type="button" id="site-menu-toggle" aria-label="Open navigation" title="Open navigation" aria-expanded="false" aria-controls="site-navigation"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <nav id="site-navigation" aria-label="Main navigation">
            <a href="{{ '/index.html' | relative_url }}"{% if page.url == '/' or page.url == '/index.html' %} aria-current="page"{% endif %}>Home</a>
            <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects' or page.url contains '/kicad-webview' %} aria-current="page"{% endif %}>Projects</a>
            <a href="{{ '/tools/' | relative_url }}"{% if page.url contains '/tools' %} aria-current="page"{% endif %}>Tools</a>
            <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} aria-current="page"{% endif %}>Blog</a>
            <a href="{{ '/play/' | relative_url }}"{% if page.url contains '/play' or page.url contains '/pong' %} aria-current="page"{% endif %}>Play</a>
            <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
            <span class="portfolio-socials">
                <a href="{{ '/' | relative_url }}#contact" aria-label="Contact details" title="Contact details"><i class="fa-brands fa-discord" aria-hidden="true"></i></a>
                <a href="https://github.com/wayri" aria-label="GitHub" title="GitHub" target="_blank" rel="noopener"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
                <a href="https://linkedin.com/in/yawar-badri" aria-label="LinkedIn" title="LinkedIn" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a>
            </span>
        </nav>
    </div>
</header>

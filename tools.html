---
layout: default
title: Engineering Tools
permalink: /tools/
custom_js: /assets/js/tools_ui.js?v=5
---

<link rel="stylesheet" href="{{ '/assets/css/tools-workspace.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script src="{{ '/assets/js/harness_designer.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>

<div class="tools-workspace-toolbar">
    <button type="button" id="tools-browser-toggle" aria-expanded="true" aria-controls="tools-browser-panel">Hide tools</button>
    <span id="tools-current-label">Choose a tool</span>
</div>
<div id="tools-workspace" class="w-full flex flex-col md:flex-row gap-4">
    <!-- SIDEBAR -->
    <aside id="tools-browser-panel" class="tools-sidebar border border-themeBorder bg-themeBg flex flex-col overflow-y-auto">
        <div class="p-4 border-b border-themeBorder sticky top-0 bg-themeBg z-10 cursor-pointer hover:bg-themeBorder/10 transition-colors" onclick="window.location.href='/tools/'">
            <h1 class="text-xl font-bold tracking-tight text-themeText font-mono"><i class="fa-solid fa-toolbox mr-2 text-themeAccent"></i>EE Tools</h1>
            <p class="mt-1 text-[10px] text-themeMuted leading-tight">Categorized calculators & simulators</p>
        </div>
        
        <nav id="tools-sidebar" class="flex flex-col flex-grow font-mono text-sm">
            <!-- Sidebar categories will be injected here by tools_ui.js -->
        </nav>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="tools-main flex-grow border border-themeBorder bg-themeContainer relative overflow-y-auto" id="tools-main-area">
        <div id="tools-welcome" class="absolute inset-0 flex flex-col items-center justify-center text-center p-8 opacity-50">
            <i class="fa-solid fa-microchip text-6xl text-themeMuted mb-4"></i>
            <h2 class="text-2xl font-bold text-themeText">Select a Tool</h2>
            <p class="text-themeMuted max-w-md mt-2 text-sm">Choose a category from the sidebar to load the engineering tools dynamically.</p>
        </div>
        
        <div id="tools-content" class="p-4 hidden flex-col gap-6 h-full">
            <!-- Dynamically loaded tool HTML will be placed here -->
        </div>
    </main>
</div>

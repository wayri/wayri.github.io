<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        } catch (error) { /* Saved preferences are optional. */ }
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/reading.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script defer src="{{ '/assets/js/reading.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</head>
<body>
    <header class="site-header">
        <nav aria-label="Main navigation">
            <a href="{{ '/' | relative_url }}" class="site-brand">YAWAR</a>
            <a href="{{ '/' | relative_url }}">Overview</a>
            <a href="{{ '/blog/' | relative_url }}" aria-current="page">Engineering_Log</a>
            <a href="{{ '/tools/' | relative_url }}">EE_Tools</a>
            <a href="{{ '/assets/resume.pdf' | relative_url }}"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i> Resume</a>
            <a href="{{ '/' | relative_url }}#contact" aria-label="Contact details" title="Contact details"><i class="fa-brands fa-discord" aria-hidden="true"></i></a>
            <a href="https://github.com/wayri" aria-label="GitHub" title="GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
            <a href="https://linkedin.com/in/yawar-badri" aria-label="LinkedIn" title="LinkedIn"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a>
        </nav>
        <button type="button" id="reading-theme-toggle" aria-label="Toggle Theme" title="Toggle Theme" aria-pressed="false" hidden><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
    </header>
    {{ content }}
</body>
</html>

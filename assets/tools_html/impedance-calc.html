<div class="doc-container flex flex-col w-full h-full">
    <div class="p-4 border-b border-themeBorder bg-themeBorder text-themeBg flex justify-between items-center" title="Impedance Calculator">
        <div class="flex items-center gap-2"><i class="fa-solid fa-wave-square"></i><h3 class="font-bold font-mono">Impedance Calculation</h3></div>
    </div>
    <div class="p-4 space-y-4 font-mono text-sm flex-grow bg-themeBg">
        <select id="imp-type" class="border border-themeBorder px-2 py-1 mb-2 font-bold w-full bg-themeContainer" onchange="runImpedanceCalc(); updateImpedanceDiagram();">
            <option value="microstrip">Microstrip</option>
            <option value="stripline">Stripline</option>
            <option value="cpw">Coplanar Waveguide</option>
        </select>

        <div class="flex flex-col items-center justify-center border border-themeBorder/30 bg-themeContainer p-4 mb-4 relative min-h-[150px]">
            <canvas id="imp-diagram" width="300" height="120"></canvas>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
                <div class="flex justify-between text-xs"><label title="Dielectric Constant">Er</label><input type="number" id="imp-er" value="4.4" step="0.1" class="w-20 border border-themeBorder px-1 text-right bg-transparent" oninput="runImpedanceCalc()"></div>
                <div class="flex justify-between text-xs"><label title="Trace Width">W (mil)</label><input type="number" id="imp-w" value="10" step="0.5" class="w-20 border border-themeBorder px-1 text-right bg-transparent" oninput="runImpedanceCalc()"></div>
                <div class="flex justify-between text-xs"><label title="Trace Thickness">T (mil)</label><input type="number" id="imp-t" value="1.4" step="0.1" class="w-20 border border-themeBorder px-1 text-right bg-transparent" oninput="runImpedanceCalc()"></div>
            </div>
            <div class="space-y-2">
                <div class="flex justify-between text-xs"><label title="Dielectric Height">H (mil)</label><input type="number" id="imp-h" value="6" step="0.5" class="w-20 border border-themeBorder px-1 text-right bg-transparent" oninput="runImpedanceCalc()"></div>
                <div class="flex justify-between text-xs opacity-50 transition-opacity" id="imp-s-grp"><label title="Clearance (CPW)">S (mil)</label><input type="number" id="imp-s" value="5" step="0.5" class="w-20 border border-themeBorder px-1 text-right bg-transparent" oninput="runImpedanceCalc()" disabled></div>
                <div class="flex justify-between text-xs opacity-50 transition-opacity" id="imp-h2-grp"><label title="Substrate Height 2 (Stripline)">H2 (mil)</label><input type="number" id="imp-h2" value="6" step="0.5" class="w-20 border border-themeBorder px-1 text-right bg-transparent" oninput="runImpedanceCalc()" disabled></div>
            </div>
        </div>

        <div class="pt-4 mt-2 border-t border-themeBorder/30">
            <div class="flex justify-between items-center text-lg font-bold text-themeAccent">
                <span class="whitespace-nowrap">Impedance (Z0)</span>
                <span id="imp-z0">-- ohms</span>
            </div>
        </div>
    </div>

    <!-- Theory & Math Section -->
    <div class="border-t border-themeBorder bg-themeContainer p-4 text-sm font-mono flex flex-col gap-2 mt-auto">
        <div class="flex items-center justify-between cursor-pointer" onclick="document.getElementById('impedancecalc-theory').classList.toggle('hidden')">
            <h4 class="font-bold text-themeAccent"><i class="fa-solid fa-calculator mr-2"></i>Math & Theory</h4>
            <i class="fa-solid fa-chevron-down text-themeMuted"></i>
        </div>
        <div id="impedancecalc-theory" class="hidden text-themeMuted mt-2 space-y-2 text-xs">
            <p><strong>Theory:</strong> PCB trace impedance depends on trace geometry and dielectric constant. It uses standard IPC-2141 approximations.</p>
        </div>
    </div>
</div>

<script>
function runImpedanceCalc() {
    const type = document.getElementById('imp-type').value;
    const er = parseFloat(document.getElementById('imp-er').value) || 4.4;
    const w = parseFloat(document.getElementById('imp-w').value) || 10;
    const t = parseFloat(document.getElementById('imp-t').value) || 1.4;
    const h = parseFloat(document.getElementById('imp-h').value) || 6;
    const s = parseFloat(document.getElementById('imp-s').value) || 5;
    const h2 = parseFloat(document.getElementById('imp-h2').value) || 6;

    const sGrp = document.getElementById('imp-s-grp');
    const h2Grp = document.getElementById('imp-h2-grp');
    const sInput = document.getElementById('imp-s');
    const h2Input = document.getElementById('imp-h2');

    let z0 = 0;

    if (type === 'microstrip') {
        sGrp.style.opacity = '0.5'; sInput.disabled = true;
        h2Grp.style.opacity = '0.5'; h2Input.disabled = true;
        // IPC-2141 Microstrip approximation
        z0 = (87.0 / Math.sqrt(er + 1.41)) * Math.log( (5.98 * h) / (0.8 * w + t) );
    } else if (type === 'stripline') {
        sGrp.style.opacity = '0.5'; sInput.disabled = true;
        h2Grp.style.opacity = '1'; h2Input.disabled = false;
        // Symmetric Stripline approx (assuming h == h2 for simplicity here, but using total b = h + h2 + t)
        const b = h + h2 + t;
        z0 = (60.0 / Math.sqrt(er)) * Math.log( (1.9 * b) / (0.8 * w + t) );
    } else if (type === 'cpw') {
        sGrp.style.opacity = '1'; sInput.disabled = false;
        h2Grp.style.opacity = '0.5'; h2Input.disabled = true;
        // Simplified CPW with ground
        const a = w / 2;
        const b = a + s;
        const k = a / b;
        // Extremely simplified approximation for demonstration
        z0 = (60.0 * Math.PI / Math.sqrt((er+1)/2)) / (Math.log(2 * (1 + Math.sqrt(k)) / (1 - Math.sqrt(k))));
    }

    if(z0 < 0 || isNaN(z0)) z0 = 0;
    document.getElementById('imp-z0').innerText = z0.toFixed(2) + ' ohms';
}

function updateImpedanceDiagram() {
    const canvas = document.getElementById('imp-diagram');
    const ctx = canvas.getContext('2d');
    const type = document.getElementById('imp-type').value;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw substrate
    ctx.fillStyle = 'rgba(74, 222, 128, 0.2)'; // green-ish dielectric
    
    // Draw copper
    ctx.fillStyle = '#f59e0b'; // amber
    
    if (type === 'microstrip') {
        ctx.fillStyle = 'rgba(74, 222, 128, 0.2)';
        ctx.fillRect(50, 60, 200, 40); // Substrate H
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(120, 50, 60, 10); // Trace W, T
        ctx.fillStyle = '#e5e7eb'; // Ground
        ctx.fillRect(50, 100, 200, 5); 
        
        ctx.fillStyle = '#9ca3af'; ctx.font = '10px monospace';
        ctx.fillText('W', 145, 45);
        ctx.fillText('H', 35, 85);
        ctx.fillText('Er', 260, 85);
    } else if (type === 'stripline') {
        ctx.fillStyle = 'rgba(74, 222, 128, 0.2)';
        ctx.fillRect(50, 30, 200, 70); // Substrate
        
        ctx.fillStyle = '#e5e7eb'; // Planes
        ctx.fillRect(50, 25, 200, 5); // Top plane
        ctx.fillRect(50, 100, 200, 5); // Bottom plane
        
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(120, 60, 60, 10); // Trace
        
        ctx.fillStyle = '#9ca3af'; ctx.font = '10px monospace';
        ctx.fillText('W', 145, 55);
        ctx.fillText('H', 35, 90);
        ctx.fillText('H2', 30, 45);
    } else if (type === 'cpw') {
        ctx.fillStyle = 'rgba(74, 222, 128, 0.2)';
        ctx.fillRect(50, 60, 200, 40); // Substrate
        
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(130, 50, 40, 10); // Trace W
        
        ctx.fillStyle = '#e5e7eb';
        ctx.fillRect(50, 50, 60, 10); // L GND
        ctx.fillRect(190, 50, 60, 10); // R GND
        ctx.fillRect(50, 100, 200, 5); // B GND
        
        ctx.fillStyle = '#9ca3af'; ctx.font = '10px monospace';
        ctx.fillText('W', 145, 45);
        ctx.fillText('S', 115, 45);
        ctx.fillText('H', 35, 85);
    }
}

// Initial Run
setTimeout(() => {
    runImpedanceCalc();
    updateImpedanceDiagram();
}, 100);
</script>

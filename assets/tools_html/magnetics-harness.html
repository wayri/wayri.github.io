<div id="tool-magnetics-harness" class="doc-container flex flex-col">
        <div class="cursor-pointer hover:opacity-90 p-4 border-b border-themeBorder bg-themeBorder text-themeBg flex justify-between items-center" onclick="window.toggleMaximize(this.parentElement)" title="Click to Maximize/Minimize">
            <div class="flex items-center gap-2"><i class="fa-solid fa-magnet"></i><h3 class="font-bold font-mono">Magnetics & Harness</h3></div>
        </div>
        <div class="p-4 space-y-4 font-mono text-sm flex-grow">
            <!-- Magnetic Field Section -->
            <div class="border border-themeBorder p-3 relative">
                <span class="absolute -top-3 left-2 bg-themeBg px-1 font-bold text-xs">Magnetic Field (B)</span>
                <div class="space-y-2 mt-2">
                    <div class="flex justify-between text-xs"><label>Turns (N)</label><input type="number" id="mag-turns" value="10" class="w-16 border border-themeBorder px-1 text-right" oninput="runMagnetics()"></div>
                    <div class="flex justify-between text-xs"><label>Current (A)</label><input type="number" id="mag-current" value="1" class="w-16 border border-themeBorder px-1 text-right" oninput="runMagnetics()"></div>
                    <div class="flex justify-between text-xs"><label>Length (mm)</label><input type="number" id="mag-length" value="50" class="w-16 border border-themeBorder px-1 text-right" oninput="runMagnetics()"></div>
                    <div class="flex justify-between text-xs"><label>Core &mu;r</label><input type="number" id="mag-mu" value="1" class="w-16 border border-themeBorder px-1 text-right" oninput="runMagnetics()"></div>
                    <div class="flex justify-between text-sm font-bold pt-2 border-t border-themeBorder/30">
                        <span class="text-themeAccent">B Field:</span><span id="mag-bfield">12.57 mT</span>
                    </div>
                </div>
            </div>

            <!-- Harness Drop Section -->
            <div class="border border-themeBorder p-3 relative">
                <span class="absolute -top-3 left-2 bg-themeBg px-1 font-bold text-xs">Harness Voltage Drop</span>
                <div class="space-y-2 mt-2">
                    <div class="flex justify-between text-xs"><label>AWG</label>
                        <select id="mag-awg" class="w-16 border border-themeBorder px-1 text-right" onchange="runMagnetics()">
                            <option value="4">4</option><option value="6">6</option><option value="8">8</option><option value="10">10</option>
                            <option value="12" selected>12</option><option value="14">14</option><option value="16">16</option>
                            <option value="18">18</option><option value="20">20</option><option value="22">22</option><option value="24">24</option>
                        </select>
                    </div>
                    <div class="flex justify-between text-xs"><label>Length (m)</label><input type="number" id="mag-wirelen" value="1" class="w-16 border border-themeBorder px-1 text-right" oninput="runMagnetics()"></div>
                    <div class="flex justify-between text-xs"><label>Current (A)</label><input type="number" id="mag-wirecurrent" value="1" class="w-16 border border-themeBorder px-1 text-right" oninput="runMagnetics()"></div>
                    <div class="flex justify-between text-sm font-bold pt-2 border-t border-themeBorder/30">
                        <span class="text-themeAccent">V Drop:</span><span id="mag-vdrop">0.002 V</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

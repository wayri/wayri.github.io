<div class="doc-container flex flex-col w-full h-full min-h-[500px]">
    <div class="p-4 border-b border-themeBorder bg-themeBorder text-themeBg flex justify-between items-center" title="dB & RF Unit Translator">
        <div class="flex items-center gap-2"><i class="fa-solid fa-tower-cell"></i><h3 class="font-bold font-mono">dB & RF Unit Translator</h3></div>
        <span class="font-mono text-[10px] opacity-70">Power & Voltage Conversions</span>
    </div>
    
    <div class="p-4 font-mono text-sm flex flex-col flex-grow overflow-y-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 h-full">
            
            <!-- Parameters -->
            <div class="space-y-4 bg-themeContainer border border-themeBorder/30 p-4 shadow-inner flex flex-col">
                <h4 class="text-xs font-bold text-themeMuted mb-2 border-b border-themeBorder/20 pb-1">INPUT</h4>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2 flex items-end gap-2">
                        <div class="flex-grow">
                            <label class="whitespace-nowrap text-[10px] mb-1 block">Value</label>
                            <input type="number" id="db-val" class="w-full bg-themeBg border border-themeBorder p-1.5 text-themeText font-bold text-themeAccent" value="0" step="1" oninput="updateDbCalc()">
                        </div>
                        <div class="w-1/3">
                            <label class="whitespace-nowrap text-[10px] mb-1 block">Unit</label>
                            <select id="db-unit" class="w-full bg-themeBg border border-themeBorder p-1.5 text-themeText outline-none" onchange="updateDbCalc()">
                                <option value="dBm" selected>dBm</option>
                                <option value="dBW">dBW</option>
                                <option value="dBV">dBV</option>
                                <option value="dBu">dBu</option>
                                <option value="W">Watts (W)</option>
                                <option value="mW">milliWatts (mW)</option>
                                <option value="Vrms">V (RMS)</option>
                                <option value="Vpk">V (Peak)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <h4 class="text-xs font-bold text-themeMuted mt-4 mb-2 border-b border-themeBorder/20 pb-1">SYSTEM</h4>
                <div>
                    <div class="flex justify-between text-[10px] mb-1"><span class="whitespace-nowrap">Characteristic Impedance ($Z_0$)</span></div>
                    <div class="flex">
                        <input type="number" id="db-z0" class="w-full bg-themeBg border border-themeBorder p-1.5 text-themeText" value="50" min="1" step="1" oninput="updateDbCalc()">
                        <span class="bg-themeBorder text-themeBg p-1.5 text-[10px] flex items-center">&Omega;</span>
                    </div>
                    <div class="flex gap-2 mt-2">
                        <button class="flex-1 bg-themeBg border border-themeBorder hover:bg-themeBorder hover:text-themeBg text-[10px] py-1" onclick="document.getElementById('db-z0').value=50; updateDbCalc()">50 &Omega;</button>
                        <button class="flex-1 bg-themeBg border border-themeBorder hover:bg-themeBorder hover:text-themeBg text-[10px] py-1" onclick="document.getElementById('db-z0').value=75; updateDbCalc()">75 &Omega;</button>
                        <button class="flex-1 bg-themeBg border border-themeBorder hover:bg-themeBorder hover:text-themeBg text-[10px] py-1" onclick="document.getElementById('db-z0').value=600; updateDbCalc()">600 &Omega;</button>
                    </div>
                </div>
            </div>

            <!-- Visualization & Results -->
            <div class="flex flex-col gap-4">
                <div class="bg-themeContainer border border-themeBorder p-0 flex flex-col shadow-inner flex-grow overflow-hidden">
                    <div class="bg-themeBorder text-themeBg p-2 text-xs font-bold text-center">EQUIVALENT VALUES</div>
                    
                    <div class="flex flex-col flex-grow divide-y divide-themeBorder/20">
                        <div class="flex justify-between p-3 hover:bg-themeBg/50">
                            <span class="text-themeMuted text-xs">Power (dBm)</span>
                            <span class="font-bold text-themeText" id="db-out-dbm">0.00</span>
                        </div>
                        <div class="flex justify-between p-3 hover:bg-themeBg/50">
                            <span class="text-themeMuted text-xs">Power (dBW)</span>
                            <span class="font-bold text-themeText" id="db-out-dbw">-30.00</span>
                        </div>
                        <div class="flex justify-between p-3 hover:bg-themeBg/50">
                            <span class="text-themeMuted text-xs">Voltage (dBV)</span>
                            <span class="font-bold text-themeText" id="db-out-dbv">-13.01</span>
                        </div>
                        <div class="flex justify-between p-3 hover:bg-themeBg/50">
                            <span class="text-themeMuted text-xs">Voltage (dBu)</span>
                            <span class="font-bold text-themeText" id="db-out-dbu">-10.79</span>
                        </div>
                        <div class="flex justify-between p-3 bg-themeBorder/10 hover:bg-themeBorder/20">
                            <span class="text-themeMuted text-xs">Power (W)</span>
                            <span class="font-bold text-themeAccent" id="db-out-w">0.001</span>
                        </div>
                        <div class="flex justify-between p-3 bg-themeBorder/10 hover:bg-themeBorder/20">
                            <span class="text-themeMuted text-xs">Power (mW)</span>
                            <span class="font-bold text-themeAccent" id="db-out-mw">1.000</span>
                        </div>
                        <div class="flex justify-between p-3 hover:bg-themeBg/50">
                            <span class="text-themeMuted text-xs">Voltage (V RMS)</span>
                            <span class="font-bold text-themeText" id="db-out-vrms">0.224</span>
                        </div>
                        <div class="flex justify-between p-3 hover:bg-themeBg/50">
                            <span class="text-themeMuted text-xs">Voltage (V Peak)</span>
                            <span class="font-bold text-themeText" id="db-out-vpk">0.316</span>
                        </div>
                        <div class="flex justify-between p-3 hover:bg-themeBg/50">
                            <span class="text-themeMuted text-xs">Voltage (V p-p)</span>
                            <span class="font-bold text-themeText" id="db-out-vpp">0.632</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function updateDbCalc() {
        const val = parseFloat(document.getElementById('db-val').value) || 0;
        const unit = document.getElementById('db-unit').value;
        const z0 = parseFloat(document.getElementById('db-z0').value) || 50;

        let p_w = 0; // Everything converted to Watts first as the base unit

        if (unit === 'dBm') {
            p_w = Math.pow(10, (val - 30) / 10);
        } else if (unit === 'dBW') {
            p_w = Math.pow(10, val / 10);
        } else if (unit === 'W') {
            p_w = val;
        } else if (unit === 'mW') {
            p_w = val / 1000;
        } else if (unit === 'dBV') {
            // dBV is 20 * log10(Vrms / 1V)
            const vrms = Math.pow(10, val / 20);
            p_w = (vrms * vrms) / z0;
        } else if (unit === 'dBu') {
            // dBu is 20 * log10(Vrms / 0.7746V)  [0.7746V is sqrt(1mW * 600 ohms)]
            const vrms = 0.774596669 * Math.pow(10, val / 20);
            p_w = (vrms * vrms) / z0;
        } else if (unit === 'Vrms') {
            p_w = (val * val) / z0;
        } else if (unit === 'Vpk') {
            const vrms = val / Math.SQRT2;
            p_w = (vrms * vrms) / z0;
        }

        // Now calculate all outputs from p_w
        let dbm = -Infinity, dbw = -Infinity, dbv = -Infinity, dbu = -Infinity;
        let p_mw = 0, vrms = 0, vpk = 0, vpp = 0;

        if (p_w > 0) {
            p_mw = p_w * 1000;
            dbw = 10 * Math.log10(p_w);
            dbm = dbw + 30;
            
            vrms = Math.sqrt(p_w * z0);
            vpk = vrms * Math.SQRT2;
            vpp = vpk * 2;
            
            dbv = 20 * Math.log10(vrms);
            dbu = 20 * Math.log10(vrms / 0.774596669);
        }

        document.getElementById('db-out-dbm').innerText = (dbm === -Infinity) ? "-∞" : dbm.toFixed(2);
        document.getElementById('db-out-dbw').innerText = (dbw === -Infinity) ? "-∞" : dbw.toFixed(2);
        document.getElementById('db-out-dbv').innerText = (dbv === -Infinity) ? "-∞" : dbv.toFixed(2);
        document.getElementById('db-out-dbu').innerText = (dbu === -Infinity) ? "-∞" : dbu.toFixed(2);
        
        // Format power gracefully
        if(p_w < 0.001) document.getElementById('db-out-w').innerText = p_w.toExponential(3);
        else document.getElementById('db-out-w').innerText = p_w.toFixed(4);
        
        if(p_mw < 0.001) document.getElementById('db-out-mw').innerText = p_mw.toExponential(3);
        else document.getElementById('db-out-mw').innerText = p_mw.toFixed(4);

        document.getElementById('db-out-vrms').innerText = vrms.toFixed(4);
        document.getElementById('db-out-vpk').innerText = vpk.toFixed(4);
        document.getElementById('db-out-vpp').innerText = vpp.toFixed(4);
    }
    
    // Initial run
    setTimeout(updateDbCalc, 100);
</script>

<div id="tool-ipc-2221-trace-width" class="doc-container flex flex-col">
        <div class="p-4 border-b border-themeBorder bg-themeBorder text-themeBg flex justify-between items-center" onclick="window.toggleMaximize(this.parentElement)" title="Click to Maximize/Minimize">
            <i class="fa-solid fa-ruler-horizontal"></i>
            <h3 class="font-bold font-mono">IPC-2221 Trace Width</h3>
        </div>
        <div class="p-4 space-y-3 font-mono text-sm flex-grow">
            <div class="flex justify-between items-center">
                <label class="w-32">Current (A)</label>
                <input type="number" id="pcb-i" value="1" step="0.1" class="w-24 border border-themeBorder px-2 py-1 text-right" oninput="runPCBTrace()">
            </div>
            <div class="flex justify-between items-center">
                <label class="w-32 text-xs" title="Max allowable temp rise">Temp Rise (Δ°C)</label>
                <input type="number" id="pcb-dt" value="10" step="1" class="w-24 border border-themeBorder px-2 py-1 text-right" oninput="runPCBTrace()">
            </div>
            <div class="flex justify-between items-center">
                <label class="w-32 text-xs">Cu Weight (oz)</label>
                <input type="number" id="pcb-th" value="1" step="0.5" class="w-24 border border-themeBorder px-2 py-1 text-right" oninput="runPCBTrace()">
            </div>

            <div class="pt-3 mt-3 border-t border-themeBorder/20">
                <div class="flex justify-between items-center mb-2">
                    <label class="font-bold text-themeText text-xs">Required Width (Ext)</label>
                </div>
                <div class="grid grid-cols-2 gap-2 text-center text-lg font-bold text-themeAccent">
                    <div class="bg-themeBorder/5 border border-themeBorder/10 p-2" id="pcb-w-mil">11.8 mil</div>
                    <div class="bg-themeBorder/5 border border-themeBorder/10 p-2" id="pcb-w-mm">0.30 mm</div>
                </div>
            </div>
        </div>
    
    <!-- Theory & Math Section -->
    <div class="border-t border-themeBorder bg-themeContainer p-4 text-sm font-mono flex flex-col gap-2 mt-auto">
        <div class="flex items-center justify-between cursor-pointer" onclick="document.getElementById('ipc2221tracewidth-theory').classList.toggle('hidden')">
            <h4 class="font-bold text-themeAccent"><i class="fa-solid fa-calculator mr-2"></i>Math & Theory</h4>
            <i class="fa-solid fa-chevron-down text-themeMuted"></i>
        </div>
        <div id="ipc2221tracewidth-theory" class="hidden text-themeMuted mt-2 space-y-2 text-xs">
            <p><strong>Theory:</strong> IPC-2221 is an industry standard for determining the minimum trace width required to carry a given current for a specified temperature rise \(\Delta T\). The formula is \(I = k \Delta T^b A^c\).</p>
        </div>
    </div>
</div>

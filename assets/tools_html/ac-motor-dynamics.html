<div id="tool-ac-motor-dynamics" class="doc-container flex flex-col">
        <div class="cursor-pointer hover:opacity-90 p-4 border-b border-themeBorder bg-themeBorder text-themeBg flex justify-between items-center" onclick="window.toggleMaximize(this.parentElement)" title="Click to Maximize/Minimize">
            <i class="fa-solid fa-gear"></i>
            <h3 class="font-bold font-mono">AC Motor Dynamics</h3>
        </div>
        <div class="p-4 space-y-3 font-mono text-sm flex-grow">
            <div class="flex gap-2 mb-2 pb-2 border-b border-themeBorder/20 text-[10px] text-themeMuted font-bold" id="motor-solve-group">
                <!-- Solvers injected by JS -->
            </div>
            
            <div id="motor-inputs" class="grid grid-cols-2 gap-4">
                <!-- Inputs injected by JS -->
            </div>

            <div class="pt-3 mt-3 border-t border-themeBorder/20 space-y-2 text-[10px]">
                <div class="flex justify-between border-b border-themeBorder/10 pb-1">
                    <span class="text-themeMuted">Synchronous Speed</span>
                    <span id="mot-rpm" class="font-bold text-themeText">- RPM</span>
                </div>
                <div class="flex justify-between border-b border-themeBorder/10 pb-1">
                    <span class="text-themeMuted">Mechanical Power</span>
                    <span class="font-bold text-themeAccent"><span id="mot-kw">-</span> kW / <span id="mot-hp">-</span> HP</span>
                </div>
                <div class="flex justify-between border-b border-themeBorder/10 pb-1">
                    <span class="text-themeMuted">Rotor Speed</span>
                    <span id="mot-rotor" class="font-bold text-themeText">- RPM</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-themeMuted">V/f Ratio (V/Hz)</span>
                    <span id="mot-vf" class="font-bold text-themeText">-</span>
                </div>
            </div>
        </div>
    </div>
